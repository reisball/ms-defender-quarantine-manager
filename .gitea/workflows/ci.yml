name: Test

"on":
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app:tests/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate manifest and source
        run: |
          python -m json.tool app/ms_quarantine_for_splunk_soar.json > /dev/null
          python tools/render_readme.py --check
          python -m compileall -q app/ms_quarantine_for_splunk_soar_connector.py app/ms_quarantine_for_splunk_soar_utils.py app/ms_quarantine_for_splunk_soar_ingestion.py app/ms_quarantine_for_splunk_soar_es_ingestion.py

      - name: Install PowerShell for transport tests
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          curl --fail --silent --show-error --location \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
            --output /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update
          apt-get install --yes powershell
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Run connector tests
        run: python -m pytest -q

      - name: Run Requested-only quarantine contracts
        run: python -m pytest -q tests/python/test_quarantine_modes.py

      - name: Run PowerShell export transport boundaries
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          export_dir=$(mktemp -d)
          trap 'find "$export_dir" -type f -delete; rmdir "$export_dir"' EXIT

          head -c 25165824 /dev/zero | base64 -w0 > "$export_dir/24mib.b64"
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/24mib.b64" \
            -ExpectedDecodedSize 25165824 > "$export_dir/24mib.jsonl"
          python - "$export_dir/24mib.jsonl" <<'PY'
          import base64
          import hashlib
          import json
          import sys

          rows = [json.loads(line) for line in open(sys.argv[1])]
          chunks = sorted(
              (row for row in rows if row.get("mode") == "chunked"),
              key=lambda row: row["chunk_index"],
          )
          trailer = next(
              row for row in rows if row.get("mode") == "chunked_complete"
          )
          encoded = "".join(row["eml_chunk"] for row in chunks)
          decoded = base64.b64decode(encoded, validate=True)
          assert len(chunks) == 132
          assert len(decoded) == 25165824
          assert hashlib.sha256(decoded).hexdigest() == trailer["sha256"]
          PY

          head -c 25165825 /dev/zero | base64 -w0 > "$export_dir/oversized.b64"
          if pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/oversized.b64" \
            -ExpectedDecodedSize 25165825 > /dev/null 2>&1; then
            echo "Expected the 24 MiB + 1 byte fixture to be rejected." >&2
            exit 1
          fi

          printf '\n' > "$export_dir/padding-split.b64"
          head -c 262142 /dev/zero | tr '\0' 'A' \
            >> "$export_dir/padding-split.b64"
          printf '==' >> "$export_dir/padding-split.b64"
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/padding-split.b64" \
            -ExpectedDecodedSize 196606 > /dev/null

      - name: Run PowerShell list output contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          for count in 0 1 2; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount "$count"
          done
          for page_size in 1 1000; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount 2 -RequestedPageSize "$page_size"
          done
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
            -MessageCount 1000 -SubjectLength 250 -UseStringDates
          for oversized_index in 0 1 2; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount 3 -SubjectLength 400000 -ExpectOversizedItem \
              -OversizedMessageIndex "$oversized_index"
          done

      - name: Run PowerShell base64 validation contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_base64_contract.ps1

      - name: Run exact Runbook error contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_error_contract.ps1

      - name: Run PowerShell Exchange connection contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: python tests/powershell/runbook_business_contract.py connection

      - name: Run PowerShell release/deny postcondition contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: python tests/powershell/runbook_business_contract.py disposition

      - name: Run PowerShell read-only diagnostic contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1)
          direct_assignment_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode direct)
          claim_only_group_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode claim_only_group)
          external_object_id_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode external_object_id)
          name_collision_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode name_collision)
          unmatched_group_error_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode unmatched_group_error)
          many_role_groups_late_match_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode many_role_groups_late_match)
          many_role_groups_no_match_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode many_role_groups_no_match)
          empty_contracts_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics.ps1 \
            -AssignmentMode empty_contracts)
          python - "$diagnostic_output" "$direct_assignment_output" \
            "$claim_only_group_output" "$external_object_id_output" \
            "$name_collision_output" "$unmatched_group_error_output" \
            "$many_role_groups_late_match_output" \
            "$many_role_groups_no_match_output" \
            "$empty_contracts_output" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          direct = json.loads(sys.argv[2])
          claim_only_group_error = json.loads(sys.argv[3])
          assert claim_only_group_error["error"] is True
          assert claim_only_group_error["error_code"] == (
              "diagnostic_rbac_partial"
          )
          claim_only_group = claim_only_group_error["details"]
          external_object_id = json.loads(sys.argv[4])
          name_collision = json.loads(sys.argv[5])
          unmatched_group_error = json.loads(sys.argv[6])
          unmatched_group = unmatched_group_error["details"]
          many_role_groups_late_match_error = json.loads(sys.argv[7])
          many_role_groups_late_match = (
              many_role_groups_late_match_error["details"]
          )
          many_role_groups_no_match_error = json.loads(sys.argv[8])
          many_role_groups_no_match = many_role_groups_no_match_error["details"]
          empty_contracts_error = json.loads(sys.argv[9])
          empty_contracts = empty_contracts_error["details"]
          assert result["action"] == "diagnose"
          assert result["status"] == "inspected"
          assert result["handling"] == "read_only"
          assert result["result_count"] == 1
          assert result["identity"] == result["observed_identity"]
          assert result["observed_release_status"] == "Requested"
          assert result["inspection_error"] == ""
          assert result["runbook_version"] == json.load(open("app/ms_quarantine_for_splunk_soar.json"))["app_version"]
          assert result["powershell_version"]
          assert result["exchange_online_management_version"] == "3.5.0"
          assert result["exchange_online_management_path"] == (
              "/mock/ExchangeOnlineManagement.psd1"
          )
          assert result["cmdlet_name"] == "Release-QuarantineMessage"
          assert result["cmdlet_contract_id"] == (
              "identity_releasetoall"
          )
          assert result["cmdlet_expected_argument_names"] == (
              "Identity,ReleaseToAll"
          )
          assert result["cmdlet_default_parameter_set"] == "Identities"
          assert "Identity" in result["cmdlet_parameter_sets"]
          assert "ReleaseToAll" in result["cmdlet_parameter_names"]
          assert result["permission_queries_read_only"] is True
          assert result["rbac_diagnostics_status"] == "complete"
          assert result["read_roles"] == "Quarantine"
          assert result["export_roles"] == "Quarantine"
          assert result["release_to_all_roles"] == "Quarantine"
          assert result["release_deny_roles"] == "Quarantine"
          assert result["quarantine_role_present"] is True
          assert result["service_principal_registered"] is True
          assert result["quarantine_group_membership_confirmed"] is True
          assert result["role_assignment_matches_identity"] is True
          assert result["quarantine_role_groups"] == (
              "Quarantine Administrator"
          )
          assert result["matched_quarantine_role_groups"] == (
              result["quarantine_role_groups"]
          )
          assert result["quarantine_role_group_total_count"] == 2
          assert result["quarantine_role_group_inspected_count"] == 2
          assert result["quarantine_role_group_inspection_truncated"] is False
          assert result["permission_query_error_count"] == 0
          assert result["permission_query_error_retained_count"] == 0
          assert result["permission_query_error_dropped_count"] == 0
          assert result["permission_query_errors_truncated"] is False
          assert result["permission_query_errors"] == []
          assert direct["rbac_diagnostics_status"] == "complete"
          assert direct["service_principal_registered"] is True
          assert direct["quarantine_group_membership_confirmed"] is False
          assert direct["role_assignment_matches_identity"] is True
          assert direct["matched_quarantine_role_groups"] == ""
          assert direct["role_group_membership_evaluated"] is False
          assert direct["permission_query_error_count"] == 0
          assert claim_only_group["rbac_diagnostics_status"] == "partial"
          assert claim_only_group["service_principal_registered"] is None
          assert (
              claim_only_group["quarantine_group_membership_confirmed"]
              is True
          )
          assert claim_only_group["role_assignment_matches_identity"] is True
          assert claim_only_group["permission_query_error_count"] == 1
          assert isinstance(claim_only_group["permission_query_errors"], list)
          assert external_object_id["rbac_diagnostics_status"] == "complete"
          assert external_object_id["service_principal_registered"] is True
          assert (
              external_object_id["registered_service_principal_object_id"]
              == "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
          )
          assert name_collision["rbac_diagnostics_status"] == "complete"
          assert name_collision["service_principal_registered"] is False
          assert name_collision["role_assignment_matches_identity"] is False
          assert name_collision["quarantine_role_groups"] == ""
          assert name_collision["matched_quarantine_role_groups"] == ""
          assert unmatched_group_error["error_code"] == (
              "diagnostic_rbac_partial"
          )
          assert unmatched_group["quarantine_role_groups"] == (
              "Quarantine Administrator"
          )
          assert unmatched_group["matched_quarantine_role_groups"] == (
              "Quarantine Administrator"
          )
          assert unmatched_group["permission_query_error_count"] == 1
          unmatched_query = unmatched_group["permission_query_errors"][0]["query"]
          assert unmatched_query.startswith("role_group_members[")
          assert unmatched_query.endswith("]")
          assert unmatched_query[len("role_group_members["):-1].isdigit()
          assert "[redacted-role-group]" in (
              unmatched_group["permission_query_errors"][0]["error"]
          )
          for truncated_error, truncated in (
              (many_role_groups_late_match_error, many_role_groups_late_match),
              (many_role_groups_no_match_error, many_role_groups_no_match),
          ):
              assert truncated_error["error_code"] == "diagnostic_rbac_partial"
              assert truncated["rbac_diagnostics_status"] == "partial"
              assert truncated["rbac_diagnostics_reason"] == (
                  "role_group_inspection_truncated"
              )
              assert truncated["quarantine_role_group_total_count"] == 25
              assert truncated["quarantine_role_group_inspected_count"] == 20
              assert (
                  truncated["quarantine_role_group_inspection_truncated"]
                  is True
              )
              assert truncated["quarantine_group_membership_confirmed"] is None
              assert truncated["role_assignment_matches_identity"] is None
              assert truncated["quarantine_role_groups"] == ""
              assert truncated["matched_quarantine_role_groups"] == ""
          assert empty_contracts_error["error_code"] == (
              "diagnostic_rbac_partial"
          )
          assert empty_contracts["rbac_diagnostics_reason"] == (
              "no_role_contracts_visible"
          )
          assert empty_contracts["rbac_empty_contracts"]
          assert empty_contracts["permission_query_error_count"] == 0
          serialised = json.dumps(result)
          assert "must-never-leave-runbook" not in serialised
          assert "must-not-appear-in-diagnostic-output" not in serialised
          assert "must-not-persist-unmatched-role-group" not in serialised
          assert "must-not-persist-unmatched-role-group" not in json.dumps(
              unmatched_group_error
          )
          PY

      - name: Run RBAC opt-in and permission-error count contracts
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          default_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_opt_in.ps1 \
            -Scenario default)
          mismatch_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_opt_in.ps1 \
            -Scenario mismatch_opt_in)
          count_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_permission_error_counts.ps1)
          python - "$default_output" "$mismatch_output" "$count_output" <<'PY'
          import json
          import sys

          default = json.loads(sys.argv[1])
          mismatch = json.loads(sys.argv[2])
          counts = json.loads(sys.argv[3])
          assert default["status"] == "inspected"
          assert default["include_rbac"] is False
          assert default["rbac_included"] is False
          assert default["rbac_diagnostics_status"] == "not_requested"
          assert "managed_identity_app_id" not in default
          assert "managed_identity_object_id" not in default
          assert mismatch["error"] is True
          assert mismatch["error_code"] == "diagnostic_inspection_unconfirmed"
          assert mismatch["details"]["include_rbac"] is True
          assert mismatch["details"]["rbac_included"] is False
          assert mismatch["details"]["rbac_diagnostics_status"] == (
              "not_requested"
          )
          assert counts == {
              "status": "permission error count contract passed",
              "scenarios": 8,
              "maximum_error_count": 200,
              "record_limit": 20,
              "utf8_byte_limit": 32768,
              "maximum_dropped_records": 180,
          }
          PY

      - name: Run missing-cmdlet diagnostic fallback contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_missing_cmdlet.ps1)
          python - "$diagnostic_output" <<'PY'
          import json
          import sys

          from ms_quarantine_for_splunk_soar_utils import (
              MSQuarantineForSplunkSOARUtils,
          )

          result = json.loads(sys.argv[1])
          assert result["action"] == "diagnose"
          assert result["error"] is True
          assert result["error_code"] == "diagnostic_rbac_not_evaluated"
          details = result["details"]
          assert details["status"] == "inspection_incomplete"
          assert details["cmdlet_command_type"] == ""
          assert details["cmdlet_parameter_sets"] == ""
          assert details["cmdlet_metadata_error"]
          assert details["rbac_diagnostics_status"] == "not_evaluated"
          assert details["rbac_diagnostics_reason"] == (
              "required_cmdlets_unavailable_in_current_exchange_session"
          )
          expected_missing = {
              "Get-ManagementRole",
              "Get-ManagementRoleEntry",
              "Get-ServicePrincipal",
              "Get-ManagementRoleAssignment",
              "Get-RoleGroupMember",
          }
          assert set(details["missing_cmdlets"]) == expected_missing
          assert details["missing_cmdlet_count"] == len(expected_missing)
          assert details["quarantine_role_present"] is None
          assert details["service_principal_registered"] is None
          assert details["role_assignment_matches_identity"] is None
          assert details["permission_query_error_count"] == len(
              details["permission_query_errors"]
          )
          assert all(
              error["exception_type"].endswith(
                  "CommandNotFoundException"
              )
              for error in details["permission_query_errors"]
              if error.get("cmdlet")
          )
          for cmdlet in expected_missing:
              assert cmdlet in result["message"]
          validator = MSQuarantineForSplunkSOARUtils(
              webhook_url="https://example.invalid/webhook",
              tenant_id="tenant",
              client_id="client",
              client_secret="secret",
              subscription_id="subscription",
              resource_group="resource-group",
              automation_account="automation-account",
          )
          validator._validate_runbook_result(
              result,
              requested_action="diagnose",
              requested_identity=details["identity"],
          )
          PY

      - name: Run PowerShell structured error contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          output=$(pwsh -NoLogo -NoProfile -File ./runbook/runbook.ps1)
          python - "$output" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          assert result["error"] is True
          assert result["action"] == "unknown"
          assert result["error_code"]
          assert result["error_context"]
          assert "No WebhookData" in result["message"]
          PY

      - name: Validate deterministic release artifacts
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          python tools/stamp_runbook.py --check
          build_one=$(mktemp -d)
          build_two=$(mktemp -d)
          package_check=$(mktemp -d)
          trap 'rm -rf -- "$build_one" "$build_two" "$package_check"' EXIT
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_COMMIT
          SOURCE_COMMIT=$(git rev-parse HEAD)
          (umask 022; LC_ALL=en_US.utf8 tools/build_release.sh "$build_one")
          (umask 077; LC_ALL=C.utf8 tools/build_release.sh "$build_two")
          diff -qr "$build_one" "$build_two"
          app_version=$(python -c 'import json; print(json.load(open("app/ms_quarantine_for_splunk_soar.json"))["app_version"])')
          tar -xzf "$build_one/ms-quarantine-for-splunk-soar-${app_version}.tgz" \
            -C "$package_check"
          python -m compileall -q \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_connector.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_utils.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_ingestion.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_es_ingestion.py"
          mkdir -p release-artifacts
          cp "$build_one"/* release-artifacts/

      - name: Upload deterministic release artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v3
        with:
          name: ms-quarantine-for-splunk-soar-release
          path: release-artifacts/
