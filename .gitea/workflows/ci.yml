              assert truncated_error["error_code"] == "diagnostic_rbac_partial"
              assert truncated["rbac_diagnostics_status"] == "partial"
              assert truncated["rbac_diagnostics_reason"] == (
                  "role_group_inspection_truncated"
              )
              assert truncated["quarantine_role_group_total_count"] == 25
              assert truncated["quarantine_role_group_inspected_count"] == 20
              assert (
                  truncated["quarantine_role_group_inspection_truncated"]
                  is True
              )
              assert truncated["quarantine_group_membership_confirmed"] is None
              assert truncated["role_assignment_matches_identity"] is None
              assert truncated["quarantine_role_groups"] == ""
              assert truncated["matched_quarantine_role_groups"] == ""
          assert empty_contracts_error["error_code"] == (
              "diagnostic_rbac_partial"
          )
          assert empty_contracts["rbac_diagnostics_reason"] == (
              "no_role_contracts_visible"
          )
          assert empty_contracts["rbac_empty_contracts"]
          assert empty_contracts["permission_query_error_count"] == 0
          serialised = json.dumps(result)
          assert "must-never-leave-runbook" not in serialised
          assert "must-not-appear-in-diagnostic-output" not in serialised
          assert "must-not-persist-unmatched-role-group" not in serialised
          assert "must-not-persist-unmatched-role-group" not in json.dumps(
              unmatched_group_error
          )
          PY

      - name: Run RBAC opt-in and permission-error count contracts
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          default_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_opt_in.ps1 \
            -Scenario default)
          mismatch_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_opt_in.ps1 \
            -Scenario mismatch_opt_in)
          count_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_permission_error_counts.ps1)
          python - "$default_output" "$mismatch_output" "$count_output" <<'PY'
          import json
          import sys

          default = json.loads(sys.argv[1])
          mismatch = json.loads(sys.argv[2])
          counts = json.loads(sys.argv[3])
          assert default["status"] == "inspected"
          assert default["include_rbac"] is False
          assert default["rbac_included"] is False
          assert default["rbac_diagnostics_status"] == "not_requested"
          assert "managed_identity_app_id" not in default
          assert "managed_identity_object_id" not in default
          assert mismatch["error"] is True
          assert mismatch["error_code"] == "diagnostic_inspection_unconfirmed"
          assert mismatch["details"]["include_rbac"] is True
          assert mismatch["details"]["rbac_included"] is False
          assert mismatch["details"]["rbac_diagnostics_status"] == (
              "not_requested"
          )
          assert counts == {
              "status": "permission error count contract passed",
              "scenarios": 8,
              "maximum_error_count": 200,
              "record_limit": 20,
              "utf8_byte_limit": 32768,
              "maximum_dropped_records": 180,
          }
          PY

      - name: Run missing-cmdlet diagnostic fallback contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_diagnostics_missing_cmdlet.ps1)
          python - "$diagnostic_output" <<'PY'
          import json
          import sys

          from ms_quarantine_for_splunk_soar_utils import (
              MSQuarantineForSplunkSOARUtils,
          )

          result = json.loads(sys.argv[1])
          assert result["action"] == "diagnose"
          assert result["error"] is True
          assert result["error_code"] == "diagnostic_rbac_not_evaluated"
          details = result["details"]
          assert details["status"] == "inspection_incomplete"
          assert details["cmdlet_command_type"] == ""
          assert details["cmdlet_parameter_sets"] == ""
          assert details["cmdlet_metadata_error"]
          assert details["rbac_diagnostics_status"] == "not_evaluated"
          assert details["rbac_diagnostics_reason"] == (
              "required_cmdlets_unavailable_in_current_exchange_session"
          )
          expected_missing = {
              "Get-ManagementRole",
              "Get-ManagementRoleEntry",
              "Get-ServicePrincipal",
              "Get-ManagementRoleAssignment",
              "Get-RoleGroupMember",
          }
          assert set(details["missing_cmdlets"]) == expected_missing
          assert details["missing_cmdlet_count"] == len(expected_missing)
          assert details["quarantine_role_present"] is None
          assert details["service_principal_registered"] is None
          assert details["role_assignment_matches_identity"] is None
          assert details["permission_query_error_count"] == len(
              details["permission_query_errors"]
          )
          assert all(
              error["exception_type"].endswith(
                  "CommandNotFoundException"
              )
              for error in details["permission_query_errors"]
              if error.get("cmdlet")
          )
          for cmdlet in expected_missing:
              assert cmdlet in result["message"]
          validator = MSQuarantineForSplunkSOARUtils(
              webhook_url="https://example.invalid/webhook",
              tenant_id="tenant",
              client_id="client",
              client_secret="secret",
              subscription_id="subscription",
              resource_group="resource-group",
              automation_account="automation-account",
          )
          validator._validate_runbook_result(
              result,
              requested_action="diagnose",
              requested_identity=details["identity"],
          )
          PY

      - name: Run PowerShell structured error contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          output=$(pwsh -NoLogo -NoProfile -File ./runbook/runbook.ps1)
          python - "$output" <<'PY'
          import json
          import sys

          result = json.loads(sys.argv[1])
          assert result["error"] is True
          assert result["action"] == "unknown"
          assert result["runbook_version"] == json.load(open("app/ms_quarantine_for_splunk_soar.json"))["app_version"]
          assert result["runbook_source_revision"]
          assert result["runbook_build_id"]
          assert "No WebhookData" in result["message"]
          PY

      - name: Validate deterministic release artifacts
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          python tools/stamp_runbook.py --check
          build_one=$(mktemp -d)
          build_two=$(mktemp -d)
          package_check=$(mktemp -d)
          trap 'rm -rf -- "$build_one" "$build_two" "$package_check"' EXIT
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_COMMIT
          SOURCE_COMMIT=$(git rev-parse HEAD)
          (umask 022; LC_ALL=en_US.utf8 tools/build_release.sh "$build_one")
          (umask 077; LC_ALL=C.utf8 tools/build_release.sh "$build_two")
          diff -qr "$build_one" "$build_two"
          app_version=$(python -c 'import json; print(json.load(open("app/ms_quarantine_for_splunk_soar.json"))["app_version"])')
          tar -xzf "$build_one/ms-quarantine-for-splunk-soar-${app_version}.tgz" \
            -C "$package_check"
          python -m compileall -q \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_connector.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_utils.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_ingestion.py" \
            "$package_check/ms-quarantine-for-splunk-soar/ms_quarantine_for_splunk_soar_es_ingestion.py"
          mkdir -p release-artifacts
          cp "$build_one"/* release-artifacts/

      - name: Upload deterministic release artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v3
        with:
          name: ms-quarantine-for-splunk-soar-release
          path: release-artifacts/
