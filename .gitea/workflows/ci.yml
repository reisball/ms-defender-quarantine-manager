name: Test

"on":
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app:tests/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate manifest and source
        run: |
          python -m json.tool app/ms_quarantine_for_splunk_soar.json > /dev/null
          python tools/render_readme.py --check
          python -m compileall -q app/ms_quarantine_for_splunk_soar_connector.py app/ms_quarantine_for_splunk_soar_utils.py app/ms_quarantine_for_splunk_soar_ingestion.py app/ms_quarantine_for_splunk_soar_es_ingestion.py

      - name: Install PowerShell for transport tests
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          curl --fail --silent --show-error --location \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
            --output /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update
          apt-get install --yes powershell
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Run connector tests
        run: python -m pytest -q

      - name: Run Requested-only quarantine contracts
        run: python -m pytest -q tests/python/test_quarantine_modes.py

      - name: Run PowerShell export transport boundaries
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          export_dir=$(mktemp -d)
          trap 'find "$export_dir" -type f -delete; rmdir "$export_dir"' EXIT

          head -c 25165824 /dev/zero | base64 -w0 > "$export_dir/24mib.b64"
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/24mib.b64" \
            -ExpectedDecodedSize 25165824 > "$export_dir/24mib.jsonl"
          python - "$export_dir/24mib.jsonl" <<'PY'
          import base64
          import hashlib
          import json
          import sys

          rows = [json.loads(line) for line in open(sys.argv[1])]
          chunks = sorted(
              (row for row in rows if row.get("mode") == "chunked"),
              key=lambda row: row["chunk_index"],
          )
          trailer = next(
              row for row in rows if row.get("mode") == "chunked_complete"
          )
          encoded = "".join(row["eml_chunk"] for row in chunks)
          decoded = base64.b64decode(encoded, validate=True)
          assert len(chunks) == 132
          assert len(decoded) == 25165824
          assert hashlib.sha256(decoded).hexdigest() == trailer["sha256"]
          PY

          head -c 25165825 /dev/zero | base64 -w0 > "$export_dir/oversized.b64"
          if pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/oversized.b64" \
            -ExpectedDecodedSize 25165825 > /dev/null 2>&1; then
            echo "Expected the 24 MiB + 1 byte fixture to be rejected." >&2
            exit 1
          fi

          printf '\n' > "$export_dir/padding-split.b64"
          head -c 262142 /dev/zero | tr '\0' 'A' \
            >> "$export_dir/padding-split.b64"
          printf '==' >> "$export_dir/padding-split.b64"
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_export_transport.ps1 \
            -Base64Path "$export_dir/padding-split.b64" \
            -ExpectedDecodedSize 196606 > /dev/null

      - name: Run PowerShell list output contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          for count in 0 1 2; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount "$count"
          done
          for page_size in 1 1000; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount 2 -RequestedPageSize "$page_size"
          done
          pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
            -MessageCount 1000 -SubjectLength 250 -UseStringDates
          for oversized_index in 0 1 2; do
            pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_list_contract.ps1 \
              -MessageCount 3 -SubjectLength 400000 -ExpectOversizedItem \
              -OversizedMessageIndex "$oversized_index"
          done

      - name: Run PowerShell base64 validation contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_base64_contract.ps1

      - name: Run exact Runbook error contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: pwsh -NoLogo -NoProfile -File ./tests/powershell/test_runbook_error_contract.ps1

      - name: Run PowerShell Exchange connection contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess

          IDENT = "__IDENTITY__"
          ORG = "var.onmicrosoft.com"
          STALE = "Credential"

          def run(body, auth_var=None, org_var=None,
                  connect_failure=False, module_mode=None,
                  import_failure=False, verbose=False):
              cmd = [
                  "pwsh", "-NoLogo", "-NoProfile", "-File",
                  "./tests/powershell/test_runbook_connection_contract.ps1",
                  "-RequestJson", json.dumps(body),
              ]
              if auth_var is not None:
                  cmd += ["-AuthMethodVariable", auth_var]
              if org_var is not None:
                  cmd += ["-OrganizationVariable", org_var]
              if connect_failure:
                  cmd.append("-ConnectFailure")
              if module_mode is not None:
                  cmd += ["-GetModuleMode", module_mode]
              if import_failure:
                  cmd.append("-ImportFailure")
              if verbose:
                  cmd.append("-EnableVerbose")
              proc = subprocess.run(
                  cmd, check=True, capture_output=True, text=True
              )
              envelope = json.loads(proc.stdout)
              assert envelope["leaked_secret"] is False, envelope
              assert envelope["leaked_secret_any_stream"] is False, envelope
              # Exchange authentication never touches credentials or the
              # retired ExchangeAuthMethod variable, whatever the mock offers.
              assert envelope["credential_reads"] == [], envelope
              assert "ExchangeAuthMethod" not in envelope["variable_reads"], (
                  envelope
              )
              for call in envelope["connect_calls"]:
                  assert call["managed_identity"] is True, envelope
                  assert call["credential_bound"] is False, envelope
                  assert call["organization_bound"] is True, envelope
              envelope["_process_output"] = proc.stdout + proc.stderr
              return envelope

          def assert_no_exchange_activity(outcome, where):
              assert outcome["connect_calls"] == [], where
              assert outcome["get_module_calls"] == 0, where
              assert outcome["quarantine_reads"] == 0, where
              assert outcome["release_calls"] == 0, where
              assert outcome["disconnect_calls"] == 0, where

          # Omitted auth_method: Managed Identity by default; the stale legacy
          # ExchangeAuthMethod=Credential variable is not consulted.
          default_mi = run(
              {"action": "release", "identity": IDENT},
              auth_var=STALE, org_var=ORG,
          )
          result = default_mi["result"]
          assert result["status"] == "released"
          assert result["exchange_auth_method"] == "ManagedIdentity"
          assert result["exchange_auth_method_source"] == "default"
          assert result["exchange_organization"] == ORG
          assert result["exchange_organization_source"] == (
              "automation_variable"
          )
          assert "exchange_credential_name" not in result
          assert "exchange_credential_source" not in result
          assert default_mi["variable_reads"][0] == "ExchangeOrganization"
          assert default_mi["connect_calls"] == [{
              "managed_identity": True, "organization": ORG,
              "organization_bound": True, "credential_bound": False,
              "credential_user_matches": False,
          }]
          assert default_mi["release_calls"] == 1
          assert default_mi["disconnect_calls"] == 1

          # Blank values behave exactly like omitted ones.
          blank = run(
              {"action": "list", "auth_method": "  ", "credential_name": " ",
               "organization": ""},
              auth_var="  ", org_var=ORG,
          )
          assert blank["result"]["count"] == 1
          assert blank["connect_calls"][0]["organization"] == ORG

          # Explicit ManagedIdentity with an organization from the webhook:
          # the ExchangeOrganization variable is not even read.
          explicit_mi = run(
              {"action": "deny", "identity": IDENT,
               "auth_method": "ManagedIdentity",
               "organization": "hook.onmicrosoft.com"},
              auth_var=STALE, org_var=ORG,
          )
          result = explicit_mi["result"]
          assert result["status"] == "denied"
          assert result["exchange_auth_method"] == "ManagedIdentity"
          assert result["exchange_auth_method_source"] == "webhook"
          assert result["exchange_organization"] == "hook.onmicrosoft.com"
          assert result["exchange_organization_source"] == "webhook"
          assert "ExchangeOrganization" not in explicit_mi["variable_reads"]
          assert explicit_mi["connect_calls"][0]["organization"] == (
              "hook.onmicrosoft.com"
          )

          # Every shared action connects with the same Managed Identity.
          for action in ("list", "export", "diagnose", "reconcile",
                         "release", "deny"):
              body = {"action": action, "auth_method": "ManagedIdentity",
                      "organization": "all.onmicrosoft.com"}
              if action != "list":
                  body["identity"] = IDENT
              if action == "reconcile":
                  body["operation_action"] = "release"
              outcome = run(body, auth_var=STALE)
              result = outcome["result"]
              details = result.get("details", result)
              assert "error" not in result, (action, result)
              assert len(outcome["connect_calls"]) == 1, action
              assert outcome["connect_calls"][0]["organization"] == (
                  "all.onmicrosoft.com"
              ), action
              assert outcome["disconnect_calls"] == 1, action
              if action == "export":
                  assert result["eml"]
              elif action == "list":
                  assert result["count"] == 1
              else:
                  assert details["exchange_auth_method"] == (
                      "ManagedIdentity"
                  ), action
                  assert details["exchange_organization"] == (
                      "all.onmicrosoft.com"
                  ), action
                  assert details["exchange_organization_source"] == (
                      "webhook"
                  ), action

          # Credential and every other unsupported method fail clearly before
          # the module import, any connection, any message access and any
          # disposition; there is no fallback to Managed Identity.
          for action in ("list", "config_check", "export", "diagnose",
                         "reconcile", "release", "deny"):
              for method in ("Credential", "credential", "managedidentity",
                             "Bogus", "Kerberos"):
                  body = {"action": action, "auth_method": method,
                          "organization": "hook.onmicrosoft.com"}
                  if action not in ("list", "config_check"):
                      body["identity"] = IDENT
                  if action == "reconcile":
                      body["operation_action"] = "release"
                  outcome = run(body, auth_var=STALE, org_var=ORG)
                  where = (action, method, outcome["result"])
                  assert outcome["result"]["error"] is True, where
                  assert outcome["result"]["error_code"] == (
                      "invalid_exchange_auth_method"
                  ), where
                  assert "ManagedIdentity only" in (
                      outcome["result"]["message"]
                  ), where
                  assert_no_exchange_activity(outcome, where)

          # A leftover credential_name from the former Credential mode is
          # rejected rather than silently ignored.
          for action, method in (("release", ""), ("deny", "ManagedIdentity"),
                                 ("config_check", "ManagedIdentity")):
              body = {"action": action, "credential_name": "Custom",
                      "organization": "hook.onmicrosoft.com"}
              if method:
                  body["auth_method"] = method
              if action != "config_check":
                  body["identity"] = IDENT
              outcome = run(body, org_var=ORG)
              where = (action, outcome["result"])
              assert outcome["result"]["error_code"] == (
                  "unsupported_credential_name"
              ), where
              assert_no_exchange_activity(outcome, where)

          # Malformed fields and a missing organization also stop before any
          # Exchange activity.
          for body, kwargs, code in (
              ({"action": "list", "auth_method": 5}, {},
               "invalid_auth_method_type"),
              ({"action": "list", "organization": 5}, {},
               "invalid_organization_type"),
              ({"action": "list", "credential_name": ["x"]}, {},
               "invalid_credential_name_type"),
              ({"action": "list"}, {}, "automation_variable_empty"),
              ({"action": "list", "organization": "  "}, {"org_var": "  "},
               "automation_variable_empty"),
              ({"action": "release", "identity": IDENT,
                "auth_method": "ManagedIdentity"}, {},
               "automation_variable_empty"),
          ):
              outcome = run(body, **kwargs)
              assert outcome["result"]["error"] is True, body
              assert outcome["result"]["error_code"] == code, (
                  body, outcome["result"]
              )
              assert_no_exchange_activity(outcome, body)
          failed_read = subprocess.run(
              ["pwsh", "-NoLogo", "-NoProfile", "-File",
               "./tests/powershell/test_runbook_connection_contract.ps1",
               "-RequestJson", json.dumps({"action": "list"}),
               "-OrganizationVariableReadFailure"],
              check=True, capture_output=True, text=True,
          )
          failed_read = json.loads(failed_read.stdout)
          assert failed_read["result"]["error_code"] == (
              "automation_variable_read_failed"
          )
          assert_no_exchange_activity(failed_read, "variable read failure")

          failed = run(
              {"action": "release", "identity": IDENT,
               "organization": "hook.onmicrosoft.com"},
              connect_failure=True,
          )
          assert failed["result"]["error_code"] == (
              "exchange_connection_failed"
          )
          assert failed["result"]["message"] == "mock connect failure"
          assert failed["result"]["details"][
              "exchange_auth_method"
          ] == "ManagedIdentity"
          assert len(failed["connect_calls"]) == 1
          assert failed["release_calls"] == 0

          # Read-only compatibility contract for mixed-version safety.
          check = run(
              {"action": "config_check", "auth_method": "ManagedIdentity",
               "organization": "hook.onmicrosoft.com"},
              auth_var=STALE,
          )
          result = check["result"]
          assert result["status"] == "verified"
          assert result["config_contract"] == "exchange_connection_v1"
          assert result["runbook_version"] == json.load(open("app/ms_quarantine_for_splunk_soar.json"))["app_version"]
          assert result["exchange_auth_method"] == "ManagedIdentity"
          assert result["exchange_auth_method_source"] == "webhook"
          assert result["exchange_organization"] == "hook.onmicrosoft.com"
          assert result["exchange_organization_source"] == "webhook"
          assert "exchange_credential_name" not in result
          assert "exchange_credential_source" not in result
          assert_no_exchange_activity(check, "config_check")
          check = run({"action": "config_check"}, org_var=ORG)
          assert check["result"]["exchange_auth_method_source"] == "default"
          assert check["result"]["exchange_organization"] == ORG
          assert check["result"]["exchange_organization_source"] == (
              "automation_variable"
          )
          assert_no_exchange_activity(check, "config_check variable")
          check = run({"action": "config_check"})
          assert check["result"]["error_code"] == "automation_variable_empty"

          # Passive module metadata is best-effort: no lookup failure may veto
          # Release/Deny and nothing secret is emitted.
          for module_mode in ("throws", "throws_secret", "null",
                              "bad_property", "huge_path"):
              for action, status in (("release", "released"),
                                     ("deny", "denied")):
                  outcome = run(
                      {"action": action, "identity": IDENT,
                       "auth_method": "ManagedIdentity",
                       "organization": "m.onmicrosoft.com"},
                      module_mode=module_mode,
                  )
                  where = (module_mode, action, outcome["result"])
                  assert outcome["get_module_calls"] == 1, where
                  assert outcome["result"]["status"] == status, where
                  assert outcome["result"]["exchange_auth_method"] == (
                      "ManagedIdentity"
                  )
                  assert len(outcome["connect_calls"]) == 1, where
                  assert outcome["release_calls"] == 1, where
                  assert outcome["disconnect_calls"] == 1, where
                  assert len(json.dumps(outcome["result"])) < 20000, where

          # With verbose output enabled, a secret-bearing optional lookup error
          # must not reach ANY stream (success, verbose, information, error,
          # process stdout/stderr) and the disposition still happens once.
          for action, status in (("release", "released"),
                                 ("deny", "denied")):
              outcome = run(
                  {"action": action, "identity": IDENT,
                   "auth_method": "ManagedIdentity",
                   "organization": "m.onmicrosoft.com"},
                  module_mode="throws_secret", verbose=True,
              )
              where = (action, outcome["result"])
              assert outcome["verbose_record_count"] > 0, where
              assert outcome["verbose_has_connect_notice"] is True, where
              assert outcome["verbose_has_lookup_notice"] is True, where
              for secret in ("never-leave-the-runbook-PASSWORD",
                             "never-leave-the-runbook-HEADER",
                             "svc-account@example.invalid",
                             "lookup failed for"):
                  assert secret not in outcome["_process_output"], where
              assert outcome["result"]["status"] == status, where
              assert len(outcome["connect_calls"]) == 1, where
              assert outcome["release_calls"] == 1, where
              assert outcome["disconnect_calls"] == 1, where

          # Read-only routes also survive a failing module lookup.
          listed = run({"action": "list", "organization": ORG},
                       module_mode="throws")
          assert listed["result"]["count"] == 1
          assert listed["disconnect_calls"] == 1

          # Genuine import and connect errors must still surface unchanged,
          # without any fallback and without any write.
          imported = run(
              {"action": "release", "identity": IDENT,
               "auth_method": "ManagedIdentity",
               "organization": "m.onmicrosoft.com"},
              import_failure=True, module_mode="throws",
          )
          assert imported["result"]["error_code"] == "module_import_failed"
          assert imported["result"]["message"] == "mock module import failure"
          assert imported["get_module_calls"] == 0
          assert imported["connect_calls"] == []
          assert imported["release_calls"] == 0
          connected = run(
              {"action": "deny", "identity": IDENT,
               "auth_method": "ManagedIdentity",
               "organization": "m.onmicrosoft.com"},
              connect_failure=True, module_mode="throws",
          )
          assert connected["result"]["error_code"] == (
              "exchange_connection_failed"
          )
          assert connected["result"]["message"] == "mock connect failure"
          assert connected["result"]["details"][
              "exchange_auth_method"
          ] == "ManagedIdentity"
          assert len(connected["connect_calls"]) == 1
          assert connected["release_calls"] == 0
          assert connected["leaked_secret"] is False
          print(json.dumps({"status": "connection contract passed"}))
          PY

      - name: Run PowerShell release/deny postcondition contract
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_postcondition_contract.ps1

          release_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release \
            -StatusSequence 'Requested,Approved,PreparingToRelease,Released')
          deny_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested,Denied')
          unknown_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested')
          release_cmdlet_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' -CmdletFailure)
          deny_cmdlet_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested' -CmdletFailure)
          authorization_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -AuthorizationFailure)
          transport_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' -TransportFailure)
          misleading_server_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -MisleadingServerFailure)
          misleading_throttle_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -MisleadingThrottleFailure)
          structured_forbidden_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -StructuredForbiddenFailure)
          intermediate_read_error_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release \
            -StatusSequence 'Requested,__ERROR__,Requested,Requested' \
            -AuthorizationFailure)
          deny_applied_after_error_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested,Denied' -CmdletFailure)
          nonterminating_error_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -NonTerminatingError)
          release_precondition_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Approved' -ForbidCmdlet)
          deny_precondition_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Approved' -ForbidCmdlet)
          reconcile_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action reconcile -OperationAction release \
            -StatusSequence 'Released' -ForbidCmdlet)
          incompatible_parameter_set_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -IncompatibleParameterSets)
          incompatible_deny_parameter_set_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested' \
            -IncompatibleParameterSets)
          observed_exchange_release_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested,Released' \
            -ObservedExchangeParameterSets)
          observed_exchange_deny_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested,Denied' \
            -ObservedExchangeParameterSets)
          alias_command_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested,Released' \
            -AliasCommand)
          deny_alias_command_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested,Denied' \
            -AliasCommand)
          broken_alias_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -BrokenAliasCommand)
          metadata_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested,Released' \
            -MetadataFailure)
          disconnect_failure_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action deny -StatusSequence 'Requested,Denied' \
            -DisconnectFailure)
          disconnect_failure_error_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested' \
            -StructuredForbiddenFailure -DisconnectFailure)
          binding_confirmed_output=$(pwsh -NoLogo -NoProfile \
            -File ./tests/powershell/test_runbook_irreversible_action.ps1 \
            -Action release -StatusSequence 'Requested,Released' \
            -IncompatibleParameterSets)
          rbac_query_failure_release_output=$(pwsh -NoLogo -NoProfile \
