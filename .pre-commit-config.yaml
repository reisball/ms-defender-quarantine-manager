# Official SOAR gates pinned to immutable commits. Preserve project attribution.
# Generated readme.html is checked by render_readme.py and djlint, not reformatted.
default_install_hook_types:
- pre-commit
- commit-msg
default_stages:
- pre-commit
repos:
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - --verbose
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: check-merge-conflict
  - id: end-of-file-fixer
    exclude: ^NOTICE$
    exclude_types:
    - markdown
  - id: trailing-whitespace
    exclude: ^NOTICE$
    exclude_types:
    - markdown
  - id: requirements-txt-fixer
  - id: check-json
  - id: check-yaml
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/djlint/djLint
  rev: df19d81c59b0b15585e5ae3144952a2903646210  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: djlint-reformat-django
    exclude: ^readme\.html$
  - id: djlint-django
- repo: https://github.com/phantomcyber/soar-app-linter
  rev: 99848c87023396eb88eb685d2140b178ef6d558a  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: soar-app-linter
    entry: python tools/soar_checks.py lint
- repo: https://github.com/hukkin/mdformat
  rev: 82912cdaea4fb830f751504486a7879c70526547  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: mdformat
    exclude: release_notes/.*
- repo: https://github.com/returntocorp/semgrep
  rev: 4cc850aff696dce0f6beddd4bb72db7f4c9abbc0  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: semgrep
    require_serial: true
    additional_dependencies:
    - setuptools==81.0.0
    args:
    - --config
    - p/python
    - --metrics=off
    - --error
- repo: https://github.com/Yelp/detect-secrets
  rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: detect-secrets
    args:
    - --no-verify
- repo: https://github.com/phantomcyber/dev-cicd-tools
  rev: 556891bcbef1c29df9ab7dfd8e6e9db7582ab4a9  # pragma: allowlist secret -- public upstream commit
  hooks:
  - id: build-docs
    language: python
    additional_dependencies:
    - local-hooks
    entry: python tools/soar_checks.py docs
  - id: copyright
    language: python
    additional_dependencies:
    - local-hooks
    args:
    - .
    - --copyright
    - Kai Seidenschnur
  - id: package-app-dependencies
    language: python
    additional_dependencies:
    - local-hooks
  - id: notice-file
    language: python
    additional_dependencies:
    - local-hooks
    args:
    - .
  - id: release-notes
    language: python
    additional_dependencies:
    - local-hooks
    args:
    - .
  - id: static-tests
    name: SOAR pre-submission static checks (registration separate)
    verbose: true
    entry: python tools/soar_checks.py static
    language: python
    additional_dependencies:
    - local-hooks
